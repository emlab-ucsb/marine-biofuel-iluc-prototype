project:
  type: website
  output-dir: _site
  # Only these two are pages, and the report comes first so the site root opens it. Without this
  # list, Quarto also publishes every .md file in the repo (e.g. r/land_use_model/PROVENANCE.md).
  # technical-notes.qmd is for collaborators: it is unlisted, and nothing in the report links to it.
  render:
    - report.qmd
    - technical-notes.qmd

website:
  title: "Marine Biofuel Indirect Land-Use Change Prototype"
  # No site search: it would index the technical notes and make them findable from the report.
  search: false
  navbar:
    left:
      - href: report.qmd
        text: Report

format:
  html:
    theme: cosmo
    toc: true
    include-after-body: _link-copy.html
